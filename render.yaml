services:
  # -------------------------------------------------------------
  # OptiMach AI All-in-One Full-Stack Web Service
  # -------------------------------------------------------------
  - type: web
    name: optimach-ai
    runtime: python
    plan: free
    buildCommand: npm install && npm run build && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health
    autoDeploy: true
